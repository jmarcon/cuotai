<!doctype html><html><body style="margin:0;background:#808080"><script>
var q=new URLSearchParams(location.search);
localStorage.clear();
if(q.get("theme"))localStorage.setItem("cuotai.theme",q.get("theme"));
if(q.get("mode"))localStorage.setItem("cuotai.themeMode",q.get("mode"));
if(q.get("locale"))localStorage.setItem("cuotai.locale",q.get("locale"));
(q.get("ls")||"").split(";").filter(Boolean).forEach(function(kv){var i=kv.indexOf("=");localStorage.setItem(kv.slice(0,i),decodeURIComponent(kv.slice(i+1)));});
var f=document.createElement("iframe");
f.style.cssText="display:block;border:0;width:"+(q.get("w")||380)+"px;height:"+(q.get("h")||600)+"px";
f.src=q.get("to")||"tray.html";
document.body.appendChild(f);
if(q.get("probe"))f.addEventListener("load",function(){setTimeout(function(){var p=document.createElement("pre");p.style.cssText="position:fixed;left:0;bottom:0;margin:0;background:#fff;color:#000;font:12px monospace;white-space:pre-wrap;max-width:100%";try{p.textContent=String(f.contentWindow.eval(q.get("probe")));}catch(e){p.textContent="ERR "+e;}document.body.appendChild(p);},2500);});
if(q.get("click"))f.onload=function(){setTimeout(function(){var d=f.contentDocument;q.get("click").split("|").forEach(function(sel,i){setTimeout(function(){var el=d.querySelector(sel);if(el)el.click();},i*300);});},1200);};
</script></body></html>
