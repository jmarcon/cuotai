# Minimal sway session for the capture: one headless output, no swaybar,
# Waybar with the example module (top of the screen).
output HEADLESS-1 resolution 2200x200 scale 2 bg #2b303b solid_color
default_border none
xwayland disable
exec waybar --config /etc/widget-shots/waybar/config.jsonc --style /etc/widget-shots/waybar/style.css >/tmp/waybar.log 2>&1
