[package]
name = "cuotai-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

# Workspace próprio: não altera o workspace do backend/TUI.
[workspace]

[lib]
name = "cuotai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
cuotai-core = { path = "../../../crates/cuotai-core" }
serde_json = "1"
dirs = "6"
