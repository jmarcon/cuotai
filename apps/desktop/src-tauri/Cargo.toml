[package]
name = "cuotai-desktop"
version = "0.42.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Workspace próprio: não altera o workspace do backend/TUI.
[workspace]

[[bin]]
name = "Cuotai"
path = "src/main.rs"

[lib]
name = "cuotai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
cuotai-core = { path = "../../../crates/cuotai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2"
# PRD 0003 RF2.2: reset notices (2.x line, compatible with Tauri 2.12).
tauri-plugin-notification = "=2.7.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
parking_lot = "0.12"
