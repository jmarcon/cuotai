[package]
name = "cuotai-desktop"
version = "0.81.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# PRD 0021 RF5.4: the desktop is a Tauri app, distributed as DMG/installer
# and through the package-manager channels, never on crates.io.
publish = false

# Own workspace: it does not change the backend/TUI workspace.
[workspace]

[[bin]]
name = "Cuotai"
path = "src/main.rs"

[lib]
name = "cuotai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# PRD 0012 RF5: Settings → Integration runs the core's local server.
cuotai-core = { path = "../../../crates/cuotai-core", features = ["serve"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2"
# PRD 0003 RF2.2: reset notices (2.x line, compatible with Tauri 2.12).
tauri-plugin-notification = "=2.7.0"
# PRD 0022 (audit #37): "Start at login" in Settings › General, through the official autostart plugin
# (2.x line, compatible with Tauri 2.12). Desktop-only: it registers a login item / Run key / .desktop entry.
tauri-plugin-autostart = "=2.7.0"
# PRD 0018 RF1.1: official updater plugin, pinned to version 2.x (compatible with Tauri 2.12).
# The `zip` feature is deliberately off: it only exists to unwrap the zipped
# updater v1 artifacts and to extract a compressed AppImage, and no release
# here publishes either (the manifest points at the raw `.exe`/`.msi` for
# Windows and the raw AppImage for Linux). Turning it off removes `zip 4.x`
# from the graph, which currently carries three extraction advisories
# (RUSTSEC-2026-0367/0368/0369) and makes `cargo deny` fail on the desktop manifest.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
# PRD 0018 RF4.3: the plugin client uses rustls without a provider; the app installs `ring`
# as the process default provider (see `updater::ensure_crypto_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
parking_lot = "0.12"

# The tray popover is a non-activating NSPanel that joins every Space, full-screen
# ones included (`macos_popover` in lib.rs). Both crates are already in the graph
# through Tauri/tao; the versions follow theirs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPanel",
  "NSResponder",
  "NSWindow",
  # PRD 0025 RF7.1: the menu-bar item's accessibility description.
  "NSAccessibilityProtocols",
  "NSButton",
  "NSControl",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

[dev-dependencies]
tempfile = "3"
# PRD 0018 RF1.4: tests sign with an ephemeral key pair (never the release key).
minisign = "0.7"
base64 = "0.22"
# PRD 0018 RF4.3: local TLS server with a self-signed certificate for the refusal test.
rcgen = "0.13"
tauri = { version = "2", features = ["test"] }
