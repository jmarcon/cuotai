[package]
name = "cuotai-desktop"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# PRD 0021 RF5.4: the desktop is a Tauri app, distributed as DMG/installer
# and through the package-manager channels, never on crates.io.
publish = false

# Own workspace: it does not change the backend/TUI workspace.
[workspace]

[[bin]]
name = "Cuotai"
path = "src/main.rs"

[lib]
name = "cuotai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
# PRD 0012 RF5: Settings → Integration runs the core's local server.
cuotai-core = { path = "../../../crates/cuotai-core", features = ["serve"] }
serde = { version = "1", features = ["derive"] }
# PRD 0025 RF4.1: the Settings preview receives the drawn menu-bar image
# (already in the graph through the core; it was a dev-dependency).
base64 = "0.22"
serde_json = "1"
dirs = "6"
tauri-plugin-dialog = "2"
# PRD 0054 RF5.3 and PRD 0052 RF2.2: the native dialog for a failure before
# any window exists, independent of the webview. The same rfd and features
# tauri-plugin-dialog already brings into the graph.
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }
# PRD 0003 RF2.2: reset notices (2.x line, compatible with Tauri 2.12).
tauri-plugin-notification = "=2.7.0"
# PRD 0022 (audit #37): "Start at login" in Settings › General, through the official autostart plugin
# (2.x line, compatible with Tauri 2.12). Desktop-only: it registers a login item / Run key / .desktop entry.
tauri-plugin-autostart = "=2.7.0"
# A second launch focuses the running app and exits (2.x line, compatible with Tauri 2.12).
tauri-plugin-single-instance = "=2.5.5"
# PRD 0018 RF1.1: official updater plugin, pinned to version 2.x (compatible with Tauri 2.12).
# The `zip` feature is deliberately off: it only exists to unwrap the zipped
# updater v1 artifacts and to extract a compressed AppImage, and no release
# here publishes either (the manifest points at the raw `.exe`/`.msi` for
# Windows and the raw AppImage for Linux). Turning it off removes `zip 4.x`
# from the graph, which currently carries three extraction advisories
# (RUSTSEC-2026-0367/0368/0369) and makes `cargo deny` fail on the desktop manifest.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
# PRD 0018 RF4.3: the plugin client uses rustls without a provider; the app installs `ring`
# as the process default provider (see `updater::ensure_crypto_provider`).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
parking_lot = "0.12"

# PRD 0014 RF3.1: the libproc calls that find a widget extension an update left
# running (`widgets::retire_stale_extension`, macOS); L-10 and L-14: the
# current user's uid for the single-instance socket and the capture sweep
# (every Unix). Already in the graph.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The tray popover is a non-activating NSPanel that joins every Space, full-screen
# ones included (`macos_popover` in lib.rs). Both crates are already in the graph
# through Tauri/tao; the versions follow theirs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPanel",
  "NSResponder",
  "NSWindow",
  # PRD 0025 RF7.1: the menu-bar item's accessibility description.
  "NSAccessibilityProtocols",
  "NSButton",
  "NSControl",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
  # PRD 0056 RF3: the website data types the parked capture window erases.
  "NSSet",
  "NSDate",
  "NSEnumerator",
] }
# PRD 0056 RF3 (`session_site_data`): erase every website data type but
# cookies from the parked capture window's store. Already in the graph
# through wry; the versions follow its.
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "objc2-core-foundation",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
  "WKWebsiteDataRecord",
] }
block2 = "0.6"

# PRD 0056 RF3 (`session_site_data`): the same erase on WebKitGTK and
# WebView2, through the crates and features wry already uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[dev-dependencies]
tempfile = "3"
# PRD 0018 RF1.4: tests sign with an ephemeral key pair (never the release key).
minisign = "0.7"
# PRD 0018 RF4.3: local TLS server with a self-signed certificate for the refusal test.
rcgen = "0.13"
tauri = { version = "2", features = ["test"] }

# Lean development builds (owner request of 2026-11-05: every worktree builds
# its own target directory). Our crates keep file and line in panics and
# backtraces; dependencies carry no debug info. Release builds are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
