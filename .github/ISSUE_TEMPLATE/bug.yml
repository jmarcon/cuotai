name: Application bug
description: Something in Cuotai (desktop, TUI or CLI) does not work as expected, other than the query of one specific provider.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not include credentials** or the contents of your `cuotai.toml`. For problems with one specific provider, use the "Broken provider or wrong data" template.
  - type: input
    id: version
    attributes:
      label: Cuotai version
      description: Output of `cuotai --version`, or the version shown in About.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Desktop
        - TUI
        - CLI (--once or --json)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example, macOS 15, Windows 11, Ubuntu 24.04.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use fictitious data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmations
      options:
        - label: I did not include credentials, e-mails or real account data.
          required: true
