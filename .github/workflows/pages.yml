# Project site on GitHub Pages, published with the "GitHub Actions" source (no
# gh-pages branch). The site is independent of the app: it deploys from `main`
# whenever its inputs change, not from a release tag, and a release never needs
# it. See "Project site" in docs/releasing.md.
#
# `build` runs scripts/site-build.sh, which assembles and validates _site/. It
# also runs on pull requests that touch the same paths, as a check of its own,
# without uploading anything. `deploy` waits for `build`, so a site that fails
# validation is never published, and it runs only for the main branch. It is
# the only job with `pages: write` and `id-token: write` (workflow-check pins
# both), and it checks out no code. configure-pages lives there because it
# reads the Pages settings, which the read-only token of `build` cannot; it
# fails clearly while Pages is off for the repository.
#
# Uses no secrets; pull requests run with `pull_request`, never
# `pull_request_target`. Actions are pinned by commit hash (tag in the comment).
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/screenshots/**"
      - "scripts/site-build.sh"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/screenshots/**"
      - "scripts/site-build.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. A newer pull request run replaces an older one. On main a
# deployment in progress always finishes; a run still waiting is replaced by a
# newer one, which is safe because each run publishes the whole tree.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate the site
        run: sh scripts/site-build.sh
      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the Pages settings
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
