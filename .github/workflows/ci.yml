# Continuous integration (PRD 0019 RF2, PRD 0039 RF8) on Linux, macOS and
# Windows. It runs on pull requests (the quality gate before main), on pushes
# to main (post-merge verification, cache warming, and the commit gate for a
# push that bypassed the ruleset), on manual dispatch (any ref) and on merge
# queue groups. A push to any other branch starts nothing: open a (draft) pull
# request or dispatch the workflow. Tags start no CI run; release.yml owns them.
# Uses no secrets: `pull_request` (never `pull_request_target`) gives fork pull
# requests a read-only token and no repository secrets. Actions are pinned by
# commit hash (tag in the comment).
#
# Documentation-only changes skip the build and test work: the `changes` job
# classifies the diff of the push or pull request and every heavy job runs only
# when it touched something that is not documentation. `changelog-check` (and
# the privacy guard) always run, and `ci-result` is the single check to require
# in branch protection: it passes when the jobs that ran passed or were skipped.
# GitHub's skip marker in a commit message is its own manual opt-out; the
# commit gate rejects it in trailers (AGENTS.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

# A push to main is classified by its own before..after diff, so a later
# documentation push must never cancel (or replace as "pending") the run of an
# earlier code push: that code would then be tested by nobody. Those runs are
# keyed by commit and never cancelled. Pull requests are classified against
# the whole change (base...head), so superseding an older run there is safe.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Documentation-only detection. The heavy jobs below run only when
  # `code == true`. Anything that is not clearly documentation counts as code,
  # and so does every case where the diff cannot be computed (a dispatch, a
  # merge group, a force push whose previous tip is gone, an empty diff such
  # as `--allow-empty`). `release_tooling` (PRD 0039 RF8.2) is true when the
  # change touches what the release flow runs (xtask, workflows, release
  # scripts, packaging templates, the Tauri configs, deny.toml) and starts the
  # `release-preflight` job; it is also true whenever the diff is undecidable.
  # Documentation is an allow-list of paths that no build, test or shipped
  # artifact reads:
  #   - README.md, CONTRIBUTING.md, SECURITY.md, AGENTS.md, apps/desktop/README.md
  #   - docs/**/*.md and docs/assets/** (screenshots)
  #   - .github/ISSUE_TEMPLATE/** and .github/*.md
  # Deliberately code, although they look like documentation:
  #   - CHANGELOG.md (embedded in the binaries and parsed by tests and release-check)
  #   - docs/providers.md (a core test compares its access matrix with the code)
  #   - docs/*.json (the export schema and example are read by core tests)
  #   - LICENSE-*, THIRD_PARTY_NOTICES (shipped in the packages and the About box)
  #   - apps/desktop/ui/** (the whole folder is embedded in the desktop app)
  #   - .github/workflows/** and every other file
  # codeql.yml applies the same allow-list in its `paths` filters: change both
  # together.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      release_tooling: ${{ steps.classify.outputs.release_tooling }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The previous tip of a push and the merge base of a pull request
          # are not in a shallow checkout.
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          range=""
          why=""
          case "$EVENT" in
            pull_request)
              range="$BASE_SHA...$HEAD_SHA"
              ;;
            push)
              if [ "$BEFORE" = "$zero" ]; then
                # New branch: compare with the default branch.
                if git rev-parse --verify --quiet "refs/remotes/origin/$DEFAULT_BRANCH^{commit}" >/dev/null; then
                  range="origin/$DEFAULT_BRANCH...$AFTER"
                else
                  why="new branch without a default branch to compare with"
                fi
              elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$AFTER"
              else
                why="previous tip $BEFORE is not in the history (force push)"
              fi
              ;;
            *)
              why="event $EVENT"
              ;;
          esac

          code=true
          tooling=true
          if [ -n "$range" ]; then
            list="$(mktemp)"
            # --no-renames lists both sides of a move, so a file moved out of
            # a code path into docs/ still counts as a code change.
            if git diff -z --name-only --no-renames "$range" > "$list"; then
              total=0
              code_files=0
              tooling_files=0
              while IFS= read -r -d '' file; do
                total=$((total + 1))
                case "$file" in
                  docs/providers.md) kind=code ;;
                  README.md | CONTRIBUTING.md | SECURITY.md | AGENTS.md | apps/desktop/README.md) kind=docs ;;
                  docs/*.md | docs/assets/* | .github/ISSUE_TEMPLATE/* | .github/*.md) kind=docs ;;
                  *) kind=code ;;
                esac
                case "$file" in
                  xtask/* | .github/workflows/* | scripts/release/* | packaging/* | deny.toml | apps/desktop/src-tauri/tauri*.json)
                    tooling_files=$((tooling_files + 1)) ;;
                esac
                echo "$kind  $file"
                if [ "$kind" = code ]; then code_files=$((code_files + 1)); fi
              done < "$list"
              if [ "$total" -gt 0 ] && [ "$tooling_files" -eq 0 ]; then
                tooling=false
              fi
              if [ "$total" -eq 0 ]; then
                why="empty diff for $range"
              elif [ "$code_files" -eq 0 ]; then
                code=false
                why="$total changed file(s), all documentation"
              else
                why="$code_files of $total changed file(s) are not documentation"
              fi
            else
              why="cannot diff $range"
            fi
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "release_tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "code=$code release_tooling=$tooling ($why)"
          {
            echo "### Change classification"
            echo
            echo "- code: \`$code\`"
            echo "- release tooling: \`$tooling\`"
            echo "- reason: $why"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Keep LF on Windows so `cargo fmt --check` and text fixtures see the repository bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      # WebKitGTK is the only system library the desktop build links; the tray
      # library (appindicator) is loaded at run time and no test opens a tray.
      # The .deb files apt would download for it (~60 MB with dependencies)
      # are cached, so a cache hit installs offline and never waits on an
      # Ubuntu mirror (one slow mirror once stalled this step for 22 minutes).
      # The cached set is the dependency closure missing from one runner
      # image, so the key carries ImageOS/ImageVersion (GitHub refreshes the
      # image about weekly); bump APT_CACHE_VERSION to force a fresh download.
      # Real .deb packages go through dpkg, so headers, pkg-config files,
      # .so symlinks and maintainer scripts match a normal install.
      - name: WebKitGTK cache key
        id: apt-key
        if: runner.os == 'Linux'
        env:
          APT_CACHE_VERSION: "1"
        run: echo "key=apt-webkitgtk-v${APT_CACHE_VERSION}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore WebKitGTK packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cuotai-apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      # A miss (or a cache the image no longer accepts) still contacts the
      # mirror: retries, a per-request stall timeout and the step timeout make
      # a stuck mirror fail fast instead of eating the job budget.
      - name: Install WebKitGTK
        id: apt-install
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          debs="$HOME/.cache/cuotai-apt-debs"
          pkgs=(libwebkit2gtk-4.1-dev)
          net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if [ "$CACHE_HIT" != "true" ]; then
            rm -rf "$debs"
            mkdir -p "$debs/partial"
            sudo apt-get "${net[@]}" update
            sudo apt-get "${net[@]}" install -y --no-install-recommends --download-only \
              -o Dir::Cache::archives="$debs" "${pkgs[@]}"
            # Leave only readable .deb files for the cache upload.
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi
          # Install the cached files with every package source disabled: apt
          # orders them (pre-dependencies included) and either the set is
          # complete for this image or it fails, without touching the mirror.
          # (`--no-download` would also refuse the local files themselves.)
          nosrc="$(mktemp -d)"
          if sudo apt-get install -y --no-install-recommends \
              -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="$nosrc" \
              "$debs"/*.deb; then
            echo "offline=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cached WebKitGTK packages did not install offline; installing from the mirror."
            sudo apt-get "${net[@]}" update
            sudo apt-get "${net[@]}" install -y --no-install-recommends "${pkgs[@]}"
          fi
      # Like the Rust cache, only main writes it; pull requests and other
      # branches restore main's entry and never save their own.
      - name: Save WebKitGTK packages
        if: >-
          runner.os == 'Linux' && github.ref == 'refs/heads/main' &&
          steps.apt-cache.outputs.cache-hit != 'true' &&
          steps.apt-install.outputs.offline == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cuotai-apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          # Only main writes the cache: pull requests reuse it without poisoning it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Formatting is OS-independent: check it once (RF8.5). Clippy stays on
      # all three systems because of cfg-gated code.
      - if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - if: runner.os == 'Linux'
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      # PRD 0018 RF3: render the real Settings/banner module with every
      # built-in catalog; no browser, package manager or network is involved.
      - run: node scripts/test-updater-ui.mjs
      # PRD 0019 RF5.2: no-network smoke of the TUI binary on each OS.
      # `--list-providers` must exit 0; `--once` on the fixture names only
      # never-defined credential variables, so every account is classified
      # missing configuration before any HTTP and the command must exit 2.
      - run: cargo build -p cuotai-tui --locked
      - name: TUI smoke (no network)
        shell: bash
        run: |
          set -e
          bin=target/debug/cuotai
          "$bin" --list-providers
          code=0
          "$bin" --config crates/cuotai-tui/tests/fixtures/smoke.toml --once --no-status || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from --once on the smoke fixture, got $code" >&2
            exit 1
          fi

  # Dependency licenses, advisories and sources (PRD 0019, RF1.3). cargo-deny
  # finds the root `deny.toml` by walking up from either manifest.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/desktop/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}

  # Version consistency (PRD 0021 RF1.2): workspace, member manifests, both
  # lockfiles, tauri.conf.json and the top released CHANGELOG section agree.
  # The same check runs with the tag in release.yml before any build.
  version-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - run: cargo run -p xtask --locked -- release-check
      - run: cargo run -p xtask --locked -- workflow-check

  # Changelog format, PRD references, plan links and footer links (PRD 0019
  # RF7.4/RF7.8, PRD 0039 RF9.5), plus the commit gate (PRD 0039 RF2) over
  # the pull request (base..head) or the push to main (before..after; a
  # previous tip lost to a force push is fetched, else the gate fails
  # closed), which needs the whole history. This is the light job that always runs, documentation-only
  # changes included: plan links live in docs/plans, and the privacy guard
  # (no personal e-mail in tracked files) is part of `cargo test`, which the
  # skipped matrix would otherwise have run. On main it also writes the next
  # version and its would-be section to the job summary (RF8.4).
  changelog-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate reads the commits of the pull request; the shallow
          # default checkout would not have the base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      # Only xtask is built here; main writes the cache like in `test`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo run -p xtask --locked -- changelog-check
      - name: commit gate (PRD 0039 RF2)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        # A push is checked from its previous tip. The gate fetches that
        # commit when a force push removed it from the history, and fails
        # closed when it cannot be recovered: it never compares the new tip
        # with itself.
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            cargo run -p xtask --locked -- changelog-gate --base "$BASE_SHA" --head "$HEAD_SHA"
          else
            cargo run -p xtask --locked -- changelog-gate --before "$BEFORE" --head "$AFTER"
          fi
      - name: next release (job summary)
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Unreleased on main"
            echo
            echo '```markdown'
            cargo run -q -p xtask --locked -- changelog-draft
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The test matrix runs this too; it only needs its own step when the
      # matrix is skipped.
      - name: privacy guard (documentation-only changes)
        if: needs.changes.outputs.code != 'true'
        run: cargo test -p xtask --locked --test privacy

  # Release preflight (PRD 0039 RF8.3): read-only, no secrets. Runs when the
  # change touches release tooling and on every release PR (head branch
  # release/v*), where it also proves the release commit with
  # `release prepare --check`. The full artifact rehearsal stays manual
  # (Actions -> Release -> Run workflow with full_rehearsal).
  release-preflight:
    needs: changes
    if: needs.changes.outputs.release_tooling == 'true' || startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release base and the commits since it
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build -p xtask --locked
      - run: ./target/debug/xtask workflow-check
      - run: ./target/debug/xtask release-check
      - name: release prepare --dry-run (scratch clone)
        shell: bash
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/release-scratch"
          git clone --quiet --no-local . "$scratch"
          ./target/debug/xtask release prepare --dry-run --repo "$scratch"
      - name: release prepare --check (release PR)
        if: startsWith(github.head_ref, 'release/v')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./target/debug/xtask release prepare --check --rev "$HEAD_SHA"
      - run: bash scripts/release/test-collect-linux.sh
      - run: cargo test -p xtask --locked --test packages

  # The one check to require in branch protection. Skipped jobs count as
  # success for required checks, but a skipped *matrix* job reports under its
  # unexpanded name (`test (${{ matrix.os }})`), so a required
  # `test (ubuntu-latest)` would wait forever on a documentation-only change.
  # This job runs unless the whole workflow run was cancelled (a newer push
  # superseded it through the concurrency group): the newer run then provides
  # the check, and a cancelled run must not post a red required check. In every
  # other case it fails when any job it waits for failed or was cancelled (a
  # timeout, for example); "skipped" is accepted only because `changes` itself
  # succeeded.
  ci-result:
    name: CI result
    needs: [changes, test, deny, version-check, changelog-check, release-preflight]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the jobs this run waited for
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '.changes.result == "success" and all(.[]; .result == "success" or .result == "skipped")' > /dev/null
