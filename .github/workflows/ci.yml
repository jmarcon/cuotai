# Continuous integration (PRD 0019, RF2). Runs on every push and pull request
# on Linux, macOS and Windows. Uses no secrets: `pull_request` (never
# `pull_request_target`) gives fork pull requests a read-only token and no
# repository secrets. Actions are pinned by commit hash (tag in the comment).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Keep LF on Windows so `cargo fmt --check` and text fixtures see the repository bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      # WebKitGTK is the only system library the desktop build links; the tray
      # library (appindicator) is loaded at run time and no test opens a tray.
      # The .deb files apt would download for it (~60 MB with dependencies)
      # are cached, so a cache hit installs offline and never waits on an
      # Ubuntu mirror (one slow mirror once stalled this step for 22 minutes).
      # The cached set is the dependency closure missing from one runner
      # image, so the key carries ImageOS/ImageVersion (GitHub refreshes the
      # image about weekly); bump APT_CACHE_VERSION to force a fresh download.
      # Real .deb packages go through dpkg, so headers, pkg-config files,
      # .so symlinks and maintainer scripts match a normal install.
      - name: WebKitGTK cache key
        id: apt-key
        if: runner.os == 'Linux'
        env:
          APT_CACHE_VERSION: "1"
        run: echo "key=apt-webkitgtk-v${APT_CACHE_VERSION}-${ImageOS:-unknown}-${ImageVersion:-unknown}-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
      - name: Restore WebKitGTK packages
        id: apt-cache
        if: runner.os == 'Linux'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cuotai-apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      # A miss (or a cache the image no longer accepts) still contacts the
      # mirror: retries, a per-request stall timeout and the step timeout make
      # a stuck mirror fail fast instead of eating the job budget.
      - name: Install WebKitGTK
        id: apt-install
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          debs="$HOME/.cache/cuotai-apt-debs"
          pkgs=(libwebkit2gtk-4.1-dev)
          net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          if [ "$CACHE_HIT" != "true" ]; then
            rm -rf "$debs"
            mkdir -p "$debs/partial"
            sudo apt-get "${net[@]}" update
            sudo apt-get "${net[@]}" install -y --no-install-recommends --download-only \
              -o Dir::Cache::archives="$debs" "${pkgs[@]}"
            # Leave only readable .deb files for the cache upload.
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$(id -u):$(id -g)" "$debs"
          fi
          # Install the cached files with every package source disabled: apt
          # orders them (pre-dependencies included) and either the set is
          # complete for this image or it fails, without touching the mirror.
          # (`--no-download` would also refuse the local files themselves.)
          nosrc="$(mktemp -d)"
          if sudo apt-get install -y --no-install-recommends \
              -o Dir::Etc::SourceList=/dev/null -o Dir::Etc::SourceParts="$nosrc" \
              "$debs"/*.deb; then
            echo "offline=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cached WebKitGTK packages did not install offline; installing from the mirror."
            sudo apt-get "${net[@]}" update
            sudo apt-get "${net[@]}" install -y --no-install-recommends "${pkgs[@]}"
          fi
      # Like the Rust cache, only main writes it; pull requests and other
      # branches restore main's entry and never save their own.
      - name: Save WebKitGTK packages
        if: >-
          runner.os == 'Linux' && github.ref == 'refs/heads/main' &&
          steps.apt-cache.outputs.cache-hit != 'true' &&
          steps.apt-install.outputs.offline == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cuotai-apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
          # Only main writes the cache: pull requests reuse it without poisoning it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      # PRD 0019 RF5.2: no-network smoke of the TUI binary on each OS.
      # `--list-providers` must exit 0; `--once` on the fixture names only
      # never-defined credential variables, so every account is classified
      # missing configuration before any HTTP and the command must exit 2.
      - run: cargo build -p cuotai-tui --locked
      - name: TUI smoke (no network)
        shell: bash
        run: |
          set -e
          bin=target/debug/cuotai
          "$bin" --list-providers
          code=0
          "$bin" --config crates/cuotai-tui/tests/fixtures/smoke.toml --once --no-status || code=$?
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from --once on the smoke fixture, got $code" >&2
            exit 1
          fi

  # Dependency licenses, advisories and sources (PRD 0019, RF1.3). cargo-deny
  # finds the root `deny.toml` by walking up from either manifest.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, apps/desktop/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: ${{ matrix.manifest }}

  # Version consistency (PRD 0021 RF1.2): workspace, member manifests, both
  # lockfiles, tauri.conf.json and the top released CHANGELOG section agree.
  # The same check runs with the tag in release.yml before any build.
  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - run: cargo run -p xtask --locked -- release-check

  # Changelog format, PRD references and plan links (PRD 0019 RF7.4 and
  # RF7.8). The pull request also passes through the feat/fix changelog
  # gate, which needs the whole history to read the commits of the PR.
  changelog-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gate reads the commits of the pull request; the shallow
          # default checkout would not have the base.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - run: cargo run -p xtask --locked -- changelog-check
      - name: changelog gate (feat/fix without the changelog)
        if: github.event_name == 'pull_request'
        run: >
          cargo run -p xtask --locked -- changelog-gate
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
