# Release pipeline (PRD 0021 RF1–RF4). One annotated `vX.Y.Z` (or
# `vX.Y.Z-rc.N`) tag on `main` builds every artifact, assembles the manifest,
# checksums and signing state, and publishes a GitHub Release as
# draft → verified → published. `workflow_dispatch` runs the same pipeline in
# dry-run mode: it builds and uploads workflow artifacts only and never
# creates a Release or contacts a package manager.
#
# Security: every action is pinned by commit hash (tag in the comment); the
# default token is read-only; `contents: write` exists only in the publish
# job, behind the protected `release` environment; GitHub expressions reach
# shell scripts only through environment variables; secrets are checked for
# presence and never echoed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse (vX.Y.Z or vX.Y.Z-rc.N); empty = v<workspace version>. A dispatch never publishes."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Cargo-installed tooling, pinned (installed with --locked).
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  # RF1: fail before any build when the tag, versions, lockfiles or changelog
  # disagree, or when the tag is not an annotated tag on main.
  check:
    name: version and tag check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.result.outputs.version }}
      channel: ${{ steps.result.outputs.channel }}
      prerelease: ${{ steps.result.outputs.prerelease }}
      tag: ${{ steps.result.outputs.tag }}
      dry_run: ${{ steps.result.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check needs history, branches and tags
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Release check (RF1)
        id: result
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cargo build -p xtask --locked
          args=(release-check --json-out check.json --changelog-out notes.txt)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Dry run: the tag may not exist, so no git ancestry check.
            [ -n "$INPUT_TAG" ] && args+=(--tag "$INPUT_TAG")
            dry_run=true
          else
            args+=(--tag "$REF_NAME" --require-main origin/main)
            dry_run=false
          fi
          ./target/debug/xtask "${args[@]}"
          {
            echo "version=$(jq -r .version check.json)"
            echo "channel=$(jq -r .channel check.json)"
            echo "prerelease=$(jq -r .prerelease check.json)"
            echo "tag=$(jq -r .tag check.json)"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  desktop-macos:
    name: desktop (macOS universal)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Apple signing keychain (complete tag credentials only)
        env:
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          HAS_APPLE_API_NOTARY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID_NOTARY: ${{ github.event_name == 'push' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: scripts/release/macos-keychain.sh
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build universal app and DMG
        working-directory: apps/desktop
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Sign and verify app payload and DMG container
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: scripts/release/macos-sign-and-verify.sh
      - name: Notarize and staple app and DMG (complete tag credentials only)
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: scripts/release/macos-notarize.sh
      - name: Collect finished artifacts and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: scripts/release/collect-macos.sh
      - name: Signing fragment
        run: scripts/release/macos-fragment.sh
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cuotai-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cuotai-release-cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-macos
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: desktop (Windows x64)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      # Keep LF so the bundled resources match the repository bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Desktop lockfile is current
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build desktop application
        working-directory: apps/desktop
        run: cargo tauri build --no-bundle -- --locked
      - name: Sign and verify application executable (tag runs, when configured)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Application -Target x86_64-pc-windows-msvc
      - name: Build NSIS and MSI from the verified application
        working-directory: apps/desktop
        run: cargo tauri bundle --bundles nsis,msi --no-binary-patching
      - name: Collect artifacts
        shell: bash
        run: scripts/release/collect-windows.sh x64
      - name: Sign and verify installers and write signing fragment
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Installers -Target x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-windows
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2.5: optional ARM64 legs never block the release; a failed leg leaves an
  # empty fragment and the manifest lists the artifacts as not produced.
  desktop-windows-arm64:
    name: desktop (Windows ARM64, optional)
    needs: check
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    environment: release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Desktop lockfile is current
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build desktop application (ARM64)
        id: build
        working-directory: apps/desktop
        run: cargo tauri build --target aarch64-pc-windows-msvc --no-bundle -- --locked
      - name: Sign and verify application executable (tag runs, when configured)
        id: sign_app
        if: steps.build.outcome == 'success'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Application -Target aarch64-pc-windows-msvc
      - name: Build NSIS from the verified application
        id: bundle
        if: steps.build.outcome == 'success'
        working-directory: apps/desktop
        run: cargo tauri bundle --target aarch64-pc-windows-msvc --bundles nsis --no-binary-patching
      - name: Collect artifacts
        id: collect
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: scripts/release/collect-windows.sh arm64
      - name: Sign and verify installer and write signing fragment
        id: sign_installers
        if: steps.collect.outcome == 'success'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Installers -Target aarch64-pc-windows-msvc -FragmentName windows-arm64.json
      - name: Unavailable marker
        if: ${{ always() && (steps.build.outcome != 'success' || steps.sign_app.outcome != 'success' || steps.bundle.outcome != 'success' || steps.collect.outcome != 'success' || steps.sign_installers.outcome != 'success') }}
        shell: bash
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > fragments/windows-arm64.json
          echo "Windows ARM64 installer not produced in this run (optional leg, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload completed optional Windows leg atomically
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-desktop-windows-arm64
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: desktop (Linux x64)
    needs: check
    runs-on: ubuntu-22.04 # oldest supported glibc (RF2)
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: System dependencies (WebKitGTK, AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build AppImage, deb and rpm
        working-directory: apps/desktop
        run: cargo tauri build --bundles appimage,deb,rpm -- --locked
      - name: Collect artifacts and signing fragment
        run: scripts/release/collect-linux.sh x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-linux
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-linux-arm64:
    name: desktop (Linux ARM64, optional)
    needs: check
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.check.outputs.version }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: System dependencies (WebKitGTK, AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build AppImage, deb and rpm (ARM64)
        id: build
        working-directory: apps/desktop
        run: cargo tauri build --target aarch64-unknown-linux-gnu --bundles appimage,deb,rpm -- --locked
      - name: Collect artifacts and signing fragment
        id: collect
        if: steps.build.outcome == 'success'
        run: scripts/release/collect-linux.sh arm64
      - name: Unavailable marker
        if: ${{ always() && (steps.build.outcome != 'success' || steps.collect.outcome != 'success') }}
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > fragments/linux-arm64.json
          echo "Linux ARM64 packages not produced in this run (optional leg, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload completed optional Linux leg atomically
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-desktop-linux-arm64
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2.2: plain cargo build per target; tarballs on Unix, zip on Windows.
  cli:
    name: cli (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar }
          # musl: `keyring` uses the pure-Rust zbus Secret Service client and
          # `rusqlite` is bundled; the D-Bus session is a run-time need only.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, archive: tar, packages: musl-tools }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          # Optional ARM64 legs (RF2.5).
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, archive: tar, optional: true, packages: gcc-aarch64-linux-gnu }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip, optional: true }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Cross-build packages
        if: matrix.packages != ''
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $PACKAGES
      - name: Cross linker (aarch64 GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build cuotai
        id: build
        run: cargo build --release --locked -p cuotai-tui --target ${{ matrix.target }}
      - name: Package (tar.gz)
        id: package_tar
        if: steps.build.outcome == 'success' && matrix.archive == 'tar'
        # Explicit: this job's matrix also contains Windows legs, whose default
        # shell is pwsh and would not expand "$TARGET"/"$VERSION".
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          scripts/release/package-cli.sh "$TARGET" "$VERSION" dist
          scripts/release/cli-fragment.sh "dist/cuotai-${VERSION}-${TARGET}.tar.gz" fragments
      - name: Package (zip)
        id: package_zip
        if: steps.build.outcome == 'success' && matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $staging = New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/$env:TARGET/release/cuotai.exe" "$staging/cuotai.exe"
          Copy-Item LICENSE-APACHE, LICENSE-MIT $staging
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "cuotai-$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$name"
          Remove-Item -Recurse -Force $staging
          New-Item -ItemType Directory -Force -Path fragments | Out-Null
          [pscustomobject]@{ artifacts = @([pscustomobject]@{
            name = $name; signed = $false; method = "checksum-signature";
            status = "unsigned";
            note = "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"
          }) } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 "fragments/cli-$env:TARGET.json"
      - name: Unavailable marker (optional legs)
        if: ${{ always() && matrix.optional == true && (steps.build.outcome != 'success' || (steps.package_tar.outcome != 'success' && steps.package_zip.outcome != 'success')) }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > "fragments/cli-${TARGET}.json"
          echo "CLI leg ${TARGET} not produced in this run (optional, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.optional != true }}
        with:
          name: dist-cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.optional != true }}
        with:
          name: signing-fragment-cli-${{ matrix.target }}
          path: fragments/
          if-no-files-found: error
          retention-days: 7
      - name: Upload completed optional CLI leg atomically
        if: ${{ always() && matrix.optional == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-cli-${{ matrix.target }}
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2: CycloneDX SBOM generated by a Cargo tool (no Node/Python).
  sbom:
    name: SBOM (CycloneDX)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Generate the aggregate release SBOM
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          mkdir -p dist fragments
          # cargo-cyclonedx 0.5 writes `<name>.json` for `--format json` and defaults
          # to CycloneDX 1.3, so the spec version is pinned and xtask is pointed
          # at the actual generated paths.
          cargo cyclonedx --manifest-path crates/cuotai-tui/Cargo.toml \
            --format json --spec-version 1.5 --target all --override-filename sbom-cli
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --format json --spec-version 1.5 --target all --override-filename sbom-desktop
          ./target/debug/xtask merge-sbom \
            --bom crates/cuotai-tui/sbom-cli.json \
            --bom apps/desktop/src-tauri/sbom-desktop.json \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --out dist/sbom.cdx.json
          jq -n '{artifacts: [{
            name: "sbom.cdx.json", signed: false,
            method: "checksum-signature", status: "unsigned",
            note: "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"}]}' \
            > fragments/sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-sbom
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2/RF3/RF4: one manifest + signing state hand-off, checksums, release
  # notes, provenance attestations. Widened token scopes live only here
  # (attestations) and in publish (contents: write).
  assemble:
    name: assemble, checksums and release notes
    needs:
      - check
      - desktop-macos
      - desktop-windows
      - desktop-windows-arm64
      - desktop-linux
      - desktop-linux-arm64
      - cli
      - sbom
    if: ${{ always() && needs.check.result == 'success' && needs.desktop-macos.result == 'success' && needs.desktop-windows.result == 'success' && needs.desktop-linux.result == 'success' && needs.cli.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing identity
      attestations: write # build-provenance attestations
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      TAG: ${{ needs.check.outputs.tag }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Download signing fragments
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-fragment-*
          path: fragments
          merge-multiple: true
      - name: Download completed optional legs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: optional-*
          path: .
          merge-multiple: true
      - name: Updater manifest (only when the updater archive is signed)
        run: |
          set -euo pipefail
          mkdir -p fragments
          # Changelog section is regenerated in this job's workspace.
          ./target/debug/xtask release-check --changelog-out notes.txt
          if [ -f dist/Cuotai.app.tar.gz.sig ]; then
            epoch="$(git show -s --format=%ct HEAD)"
            pub_date="$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
            ./target/debug/xtask updater-manifest \
              --version "$VERSION" --repo "$REPO" --tag "$TAG" \
              --notes-file notes.txt \
              --pub-date "$pub_date" \
              --archive dist/Cuotai.app.tar.gz --out dist/latest.json
            jq -n '{artifacts: [{name: "latest.json", signed: false,
              method: "checksum-signature", status: "unsigned",
              note: "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"}]}' \
              > fragments/assemble.json
          else
            printf '{"artifacts": []}\n' > fragments/assemble.json
            echo "no updater signature: latest.json not generated (stated in signing-state.json)"
          fi
      - name: Manifest and SHA256SUMS
        run: ./target/debug/xtask release-manifest --artifacts-dir dist --version "$VERSION" --channel "$CHANNEL" --out-dir dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.check.outputs.dry_run != 'true'
      - name: Sign SHA256SUMS (Sigstore keyless)
        if: needs.check.outputs.dry_run != 'true'
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - name: Signing state
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            checksums=unavailable
            status="dry-run: checksum signature not produced (dispatch runs never publish)"
          else
            checksums=signed
            status="signed by the GitHub Actions OIDC identity (Sigstore keyless)"
          fi
          ./target/debug/xtask signing-state \
            --version "$VERSION" --channel "$CHANNEL" \
            --manifest dist/manifest.json --fragments-dir fragments \
            --checksums "$checksums" --checksums-status "$status" \
            --out dist/signing-state.json
      - name: Release notes
        run: ./target/debug/xtask release-notes --changelog CHANGELOG.md --version "$VERSION" --manifest dist/manifest.json --signing-state dist/signing-state.json --repo "$REPO" --out dist/release-body.md
      - name: Dry-run attestation note
        if: needs.check.outputs.dry_run == 'true'
        run: |
          echo "dry-run: attestable artifacts produced; provenance attestations are not published on dispatch runs" >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        if: needs.check.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assembly
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # RF4.1/RF4.3: tag runs only, behind the protected `release` environment.
  # A failed or interrupted run leaves at most a draft.
  publish:
    name: draft, verify and publish the GitHub Release
    needs: [check, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      attestations: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download release assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembly
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create or update the draft and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: dist
          BODY_FILE: dist/release-body.md
        run: scripts/release/publish-release.sh draft
      - name: Verify the complete draft assembly (RF4.4, pre-publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_DIR: dist
          BODY_FILE: dist/release-body.md
          XTASK: ./target/debug/xtask
        run: scripts/release/verify-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: dist
          BODY_FILE: dist/release-body.md
        run: scripts/release/publish-release.sh publish

  # RF4.4: after publishing, download the public assets again and re-check.
  verify-public:
    name: verify published assets
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download release assembly (for the manifest)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembly
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the complete public assembly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_DIR: dist
          BODY_FILE: dist/release-body.md
          XTASK: ./target/debug/xtask
        run: scripts/release/verify-release.sh
