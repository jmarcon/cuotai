# Release pipeline (PRD 0021 RF1–RF5/RF9). One annotated `vX.Y.Z` (or
# `vX.Y.Z-rc.N`) tag on `main` builds every artifact, assembles the manifest,
# checksums and signing state, and publishes a GitHub Release as
# draft → verified → published. A routine `workflow_dispatch` is a cheap,
# secretless preflight; selecting `full_rehearsal` builds and uploads the same
# artifacts without creating a Release or contacting a package manager.
#
# Security: every action is pinned by commit hash (tag in the comment); the
# default token is read-only; `contents: write` exists only in the publish
# job, behind the owner-configured `release` environment; GitHub expressions
# reach shell scripts only through environment variables; secrets are checked
# for presence and never echoed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse (vX.Y.Z or vX.Y.Z-rc.N); empty = v<workspace version>. A dispatch never publishes."
        required: false
        type: string
      full_rehearsal:
        description: "Build and upload every artifact without publishing. Leave off for the cheap preflight."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Cargo-installed tooling, pinned (installed with --locked).
  TAURI_CLI_VERSION: "2.12.4"
  CARGO_CYCLONEDX_VERSION: "0.5.9"

jobs:
  # RF1/RF9: fail before any build when the tag, versions, lockfiles,
  # changelog or workflow policy disagree.
  check:
    name: version and tag check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.result.outputs.version }}
      channel: ${{ steps.result.outputs.channel }}
      prerelease: ${{ steps.result.outputs.prerelease }}
      tag: ${{ steps.result.outputs.tag }}
      dry_run: ${{ steps.result.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the ancestry check needs history, branches and tags
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Release check (RF1)
        id: result
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          FULL_REHEARSAL: ${{ inputs.full_rehearsal }}
        run: |
          set -euo pipefail
          cargo build -p xtask --locked
          ./target/debug/xtask workflow-check
          args=(release-check --json-out check.json --changelog-out notes.txt)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Dry run: the tag may not exist, so no git ancestry check.
            [ -n "$INPUT_TAG" ] && args+=(--tag "$INPUT_TAG")
            dry_run=true
          else
            args+=(--tag "$REF_NAME" --require-main origin/main)
            dry_run=false
          fi
          ./target/debug/xtask "${args[@]}"
          {
            echo "version=$(jq -r .version check.json)"
            echo "channel=$(jq -r .channel check.json)"
            echo "prerelease=$(jq -r .prerelease check.json)"
            echo "tag=$(jq -r .tag check.json)"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "### Secretless release rehearsal"
              echo
              if [ "$FULL_REHEARSAL" = "true" ]; then
                echo "Full artifact rehearsal requested. Build, SBOM and assembly jobs run; publishing and package-manager writes remain disabled."
              else
                echo "Version/tag and workflow policy passed. Enable **full_rehearsal** explicitly to spend runner time building artifacts."
                echo "Heavy build, SBOM and assembly jobs were skipped."
              fi
              echo "No GitHub Release or package-manager repository will be modified by a dispatch."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  release-prerequisites:
    name: required release credentials
    needs: check
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    steps:
      - name: Validate required release credentials
        env:
          HAS_TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "push" ]; then
            echo "dispatch rehearsal: release credentials are intentionally unavailable"
            exit 0
          fi
          missing=()
          [ "$HAS_TAURI_SIGNING_PRIVATE_KEY" = "true" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY)
          [ "$HAS_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" = "true" ] || missing+=(TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::missing required release-environment secrets: %s\n' "${missing[*]}"
            exit 1
          fi

  desktop-macos:
    name: desktop (macOS universal)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: macos-latest
    timeout-minutes: 90
    # Tag pushes use the owner-configured `release` environment. Dispatch
    # rehearsals use the separate secretless `rehearsal` environment.
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Apple signing keychain (complete tag credentials only)
        env:
          APPLE_CERTIFICATE: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          HAS_APPLE_API_NOTARY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
          HAS_APPLE_ID_NOTARY: ${{ github.event_name == 'push' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: scripts/release/macos-keychain.sh
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build universal app and DMG
        working-directory: apps/desktop
        # No `tauri.updater.conf.json` overlay here (PRD 0018 RF1.1): the macOS
        # updater artifact is the notarized app, which only exists after the
        # notarization below, so `collect-macos.sh` archives and updater-signs
        # it afterwards. Bundling-time signatures would cover the pre-notarized
        # app.
        run: cargo tauri build --target universal-apple-darwin --bundles app,dmg -- --locked
      - name: Sign and verify app payload and DMG container
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        run: scripts/release/macos-sign-and-verify.sh
      - name: Notarize and staple app and DMG (complete tag credentials only)
        env:
          APPLE_SIGNING_IDENTITY: ${{ github.event_name == 'push' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ github.event_name == 'push' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ github.event_name == 'push' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_ID: ${{ github.event_name == 'push' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.event_name == 'push' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'push' && secrets.APPLE_TEAM_ID || '' }}
        run: scripts/release/macos-notarize.sh
      - name: Collect finished artifacts and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: scripts/release/collect-macos.sh
      - name: Signing fragment
        run: scripts/release/macos-fragment.sh
      - name: Remove temporary Apple signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cuotai-release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cuotai-release-cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-macos
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-macos
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: desktop (Windows x64)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: windows-latest
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Keep LF so the bundled resources match the repository bytes.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Desktop lockfile is current
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build desktop application
        working-directory: apps/desktop
        run: cargo tauri build --no-bundle -- --locked
      - name: Sign and verify application executable (tag runs, when configured)
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Application -Target x86_64-pc-windows-msvc
      - name: Build NSIS and MSI from the verified application
        working-directory: apps/desktop
        run: cargo tauri bundle --bundles nsis,msi --no-binary-patching
      - name: Collect artifacts
        shell: bash
        run: scripts/release/collect-windows.sh x64
      - name: Sign and verify installers and write signing fragment
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Installers -Target x86_64-pc-windows-msvc
      # PRD 0018 RF1.1: updater-signs the collected installers. It runs after
      # Authenticode, because that rewrites the installer bytes and would
      # invalidate an updater signature computed while bundling. The key is
      # only present on tag runs, and only in this step.
      - name: Updater-sign the installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          scripts/release/updater-sign.sh "dist/Cuotai_${VERSION}_x64-setup.exe" fragments/windows.json
          scripts/release/updater-sign.sh "dist/Cuotai_${VERSION}_x64_en-US.msi" fragments/windows.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-windows
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-windows
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2.5: optional ARM64 legs never block the release; a failed leg leaves an
  # empty fragment and the manifest lists the artifacts as not produced.
  desktop-windows-arm64:
    name: desktop (Windows ARM64, optional)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: windows-11-arm
    continue-on-error: true
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Desktop lockfile is current
        shell: bash
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build desktop application (ARM64)
        id: build
        working-directory: apps/desktop
        run: cargo tauri build --target aarch64-pc-windows-msvc --no-bundle -- --locked
      - name: Sign and verify application executable (tag runs, when configured)
        id: sign_app
        if: steps.build.outcome == 'success'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Application -Target aarch64-pc-windows-msvc
      - name: Build NSIS from the verified application
        id: bundle
        if: steps.build.outcome == 'success'
        working-directory: apps/desktop
        run: cargo tauri bundle --target aarch64-pc-windows-msvc --bundles nsis --no-binary-patching
      - name: Collect artifacts
        id: collect
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: scripts/release/collect-windows.sh arm64
      - name: Sign and verify installer and write signing fragment
        id: sign_installers
        if: steps.collect.outcome == 'success'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE || '' }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ github.event_name == 'push' && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: scripts/release/windows-sign.ps1 -Mode Installers -Target aarch64-pc-windows-msvc -FragmentName windows-arm64.json
      - name: Updater-sign the ARM64 installer (PRD 0018 RF1.1)
        id: updater_sign
        if: steps.sign_installers.outcome == 'success'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: scripts/release/updater-sign.sh "dist/Cuotai_${VERSION}_arm64-setup.exe" fragments/windows-arm64.json
      - name: Unavailable marker
        if: ${{ always() && (steps.build.outcome != 'success' || steps.sign_app.outcome != 'success' || steps.bundle.outcome != 'success' || steps.collect.outcome != 'success' || steps.sign_installers.outcome != 'success' || steps.updater_sign.outcome == 'failure') }}
        shell: bash
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > fragments/windows-arm64.json
          echo "Windows ARM64 installer not produced in this run (optional leg, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload completed optional Windows leg atomically
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-desktop-windows-arm64
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: desktop (Linux x64)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: ubuntu-22.04 # oldest supported glibc (RF2)
    timeout-minutes: 90
    # The Tauri updater key lives here (PRD 0018 RF4.1): the Linux packages
    # are updater-signed while bundling, so tag jobs use the owner-configured
    # environment while rehearsals use a secretless environment.
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      # Retries, a per-request stall timeout and the step timeout make a stuck
      # Ubuntu mirror fail fast instead of eating the job budget.
      - name: System dependencies (WebKitGTK, AppImage tooling)
        timeout-minutes: 10
        run: |
          net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${net[@]}" update
          sudo apt-get "${net[@]}" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build AppImage, deb and rpm
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        # PRD 0018 RF1.1: `createUpdaterArtifacts` is enabled through the
        # release-time overlay, and only when the key exists — a build without
        # it must still bundle during a secretless dispatch rehearsal.
        # Nothing rewrites these package bytes afterwards, so the signatures
        # the bundler writes here are the final ones.
        run: |
          set -euo pipefail
          args=(build --bundles "appimage,deb,rpm")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config src-tauri/tauri.updater.conf.json)
          else
            echo "no Tauri updater key: bundling without updater artifacts"
          fi
          cargo tauri "${args[@]}" -- --locked
      # No updater key here: `collect-linux.sh` only copies the packages and the
      # signatures the bundler already wrote, so the production key never
      # reaches a step that does not sign (PRD 0018 RF4.1).
      - name: Collect artifacts and signing fragment
        run: scripts/release/collect-linux.sh x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-linux
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-desktop-linux
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  desktop-linux-arm64:
    name: desktop (Linux ARM64, optional)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    timeout-minutes: 90
    environment: ${{ github.event_name == 'push' && 'release' || 'rehearsal' }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      # Retries, a per-request stall timeout and the step timeout make a stuck
      # Ubuntu mirror fail fast instead of eating the job budget.
      - name: System dependencies (WebKitGTK, AppImage tooling)
        timeout-minutes: 10
        run: |
          net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${net[@]}" update
          sudo apt-get "${net[@]}" install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - name: Desktop lockfile is current
        run: cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 > /dev/null
      - name: Install tauri-cli
        run: cargo install tauri-cli --locked --version "$TAURI_CLI_VERSION"
      - name: Build AppImage, deb and rpm (ARM64)
        id: build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          args=(build --target aarch64-unknown-linux-gnu --bundles "appimage,deb,rpm")
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            args+=(--config src-tauri/tauri.updater.conf.json)
          fi
          cargo tauri "${args[@]}" -- --locked
      - name: Collect artifacts and signing fragment
        id: collect
        if: steps.build.outcome == 'success'
        run: scripts/release/collect-linux.sh arm64
      - name: Unavailable marker
        if: ${{ always() && (steps.build.outcome != 'success' || steps.collect.outcome != 'success') }}
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > fragments/linux-arm64.json
          echo "Linux ARM64 packages not produced in this run (optional leg, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload completed optional Linux leg atomically
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-desktop-linux-arm64
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2.2: plain cargo build per target; tarballs on Unix, zip on Windows.
  cli:
    name: cli (${{ matrix.target }})
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, archive: tar }
          - { os: macos-latest, target: x86_64-apple-darwin, archive: tar }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar }
          # musl: `keyring` uses the pure-Rust zbus Secret Service client and
          # `rusqlite` is bundled; the D-Bus session is a run-time need only.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, archive: tar, packages: musl-tools }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
          # Optional ARM64 legs (RF2.5). For aarch64-unknown-linux-gnu, ring 0.17
          # is pulled in transitively and needs glibc headers for the cross
          # target; without `libc6-dev-arm64-cross` the build fails with
          # `fatal error: bits/libc-header-start.h` and the matrix row turns
          # into a blocker (run 39673307029). The optional row stays
          # non-blocking via job-level `continue-on-error`; assembly never
          # requires its result and the manifest step lists any missing
          # artifact under `missing_optional`.
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-gnu, archive: tar, optional: true, packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, archive: zip, optional: true }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Cross-build packages
        if: matrix.packages != ''
        timeout-minutes: 10
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          net=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${net[@]}" update
          read -r -a packages <<< "$PACKAGES"
          sudo apt-get "${net[@]}" install -y --no-install-recommends "${packages[@]}"
      - name: Cross linker (aarch64 GNU)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build cuotai
        id: build
        run: cargo build --release --locked -p cuotai-tui --target ${{ matrix.target }}
      - name: Package (tar.gz)
        id: package_tar
        if: steps.build.outcome == 'success' && matrix.archive == 'tar'
        # Explicit: this job's matrix also contains Windows legs, whose default
        # shell is pwsh and would not expand "$TARGET"/"$VERSION".
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          scripts/release/package-cli.sh "$TARGET" "$VERSION" dist
          scripts/release/cli-fragment.sh "dist/cuotai-${VERSION}-${TARGET}.tar.gz" fragments
      - name: Package (zip)
        id: package_zip
        if: steps.build.outcome == 'success' && matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $staging = New-Item -ItemType Directory -Force -Path staging
          Copy-Item "target/$env:TARGET/release/cuotai.exe" "$staging/cuotai.exe"
          Copy-Item LICENSE-APACHE, LICENSE-MIT $staging
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $name = "cuotai-$env:VERSION-$env:TARGET.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "dist/$name"
          Remove-Item -Recurse -Force $staging
          New-Item -ItemType Directory -Force -Path fragments | Out-Null
          [pscustomobject]@{ artifacts = @([pscustomobject]@{
            name = $name; signed = $false; method = "checksum-signature";
            status = "unsigned";
            note = "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"
          }) } | ConvertTo-Json -Depth 5 |
            Set-Content -Encoding utf8 "fragments/cli-$env:TARGET.json"
      - name: Unavailable marker (optional legs)
        if: ${{ always() && matrix.optional == true && (steps.build.outcome != 'success' || (steps.package_tar.outcome != 'success' && steps.package_zip.outcome != 'success')) }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rm -rf dist
          mkdir -p fragments
          printf '{"artifacts": []}\n' > "fragments/cli-${TARGET}.json"
          echo "CLI leg ${TARGET} not produced in this run (optional, RF2.5)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.optional != true }}
        with:
          name: dist-cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && matrix.optional != true }}
        with:
          name: signing-fragment-cli-${{ matrix.target }}
          path: fragments/
          if-no-files-found: error
          retention-days: 7
      - name: Upload completed optional CLI leg atomically
        if: ${{ always() && matrix.optional == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-cli-${{ matrix.target }}
          path: |
            dist/
            fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2: CycloneDX SBOM generated by a Cargo tool (no Node/Python).
  sbom:
    name: SBOM (CycloneDX)
    needs: [check, release-prerequisites]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version "$CARGO_CYCLONEDX_VERSION"
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Generate the aggregate release SBOM
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          mkdir -p dist fragments
          # cargo-cyclonedx 0.5 writes `<name>.json` for `--format json` and defaults
          # to CycloneDX 1.3, so the spec version is pinned and xtask is pointed
          # at the actual generated paths.
          cargo cyclonedx --manifest-path crates/cuotai-tui/Cargo.toml \
            --format json --spec-version 1.5 --target all --override-filename sbom-cli
          cargo cyclonedx --manifest-path apps/desktop/src-tauri/Cargo.toml \
            --format json --spec-version 1.5 --target all --override-filename sbom-desktop
          ./target/debug/xtask merge-sbom \
            --bom crates/cuotai-tui/sbom-cli.json \
            --bom apps/desktop/src-tauri/sbom-desktop.json \
            --version "$VERSION" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --out dist/sbom.cdx.json
          jq -n '{artifacts: [{
            name: "sbom.cdx.json", signed: false,
            method: "checksum-signature", status: "unsigned",
            note: "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"}]}' \
            > fragments/sbom.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signing-fragment-sbom
          path: fragments/
          if-no-files-found: error
          retention-days: 7

  # RF2/RF3/RF4: one manifest + signing state hand-off, checksums, release
  # notes, provenance attestations. Widened token scopes live only here
  # (attestations) and in publish (contents: write).
  #
  # Gating model — two layers:
  # 1) The matrix `needs` deliberately lists every row (`cli`, `desktop-*`,
  #    `sbom`); the `if:` condition below keys on each REQUIRED result and
  #    ignores optional ones, so an optional ARM runner failure cannot skip
  #    assembly (run 39673307029 reproduced that exact defect). Optional CLI
  #    rows also use job-level `continue-on-error` for the case where the
  #    whole job is not even allocated.
  # 2) The download step always runs and only fetches what was produced; the
  #    authoritative required-artifact gate is `xtask release-manifest`, which
  #    fails the job when a mandatory name is missing. That keeps required
  #    CLI failures (x64/mac/musl/Windows) fail-closed while letting an
  #    optional ARM cross build just record `missing_optional` and continue.
  assemble:
    name: assemble, checksums and release notes
    needs:
      - check
      - desktop-macos
      - desktop-windows
      - desktop-windows-arm64
      - desktop-linux
      - desktop-linux-arm64
      - cli
      - sbom
    if: ${{ always() && needs.check.result == 'success' && needs.desktop-macos.result == 'success' && needs.desktop-windows.result == 'success' && needs.desktop-linux.result == 'success' && needs.sbom.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Sigstore keyless signing identity
      attestations: write # build-provenance attestations
    env:
      VERSION: ${{ needs.check.outputs.version }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      TAG: ${{ needs.check.outputs.tag }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Download signing fragments
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: signing-fragment-*
          path: fragments
          merge-multiple: true
      - name: Download completed optional legs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: optional-*
          path: .
          merge-multiple: true
      - name: Updater manifest (only when the updater artifacts are signed)
        run: |
          set -euo pipefail
          mkdir -p fragments
          # Changelog section is regenerated in this job's workspace and
          # becomes the release notes shown by the updater (PRD 0018 RF2.2).
          ./target/debug/xtask release-check --changelog-out notes.txt
          # One manifest for every platform this run produced (RF1.3). A
          # platform whose updater artifact was not signed is simply absent;
          # a collected artifact with no signature fails the xtask call.
          platforms=()
          updater_count=0
          add_platform() { # <manifest key> <file in dist/>
            local key="$1" name="$2"
            # An updater archive is the payload WITH its detached `.sig`: the
            # manifest is never generated from an unsigned payload, so a
            # payload without its signature does not count as updater output.
            if [ -f "dist/$name" ] && [ -f "dist/$name.sig" ]; then
              platforms+=(--platform "$key=dist/$name")
              updater_count=$((updater_count + 1))
            fi
          }
          # macOS: one universal archive serves both architectures.
          add_platform darwin-aarch64-app Cuotai.app.tar.gz
          add_platform darwin-x86_64-app Cuotai.app.tar.gz
          # Windows: NSIS is the default installer; the MSI keeps its own key.
          add_platform windows-x86_64-nsis "Cuotai_${VERSION}_x64-setup.exe"
          add_platform windows-x86_64-msi "Cuotai_${VERSION}_x64_en-US.msi"
          add_platform windows-aarch64-nsis "Cuotai_${VERSION}_arm64-setup.exe"
          # Linux: AppImage is the generic answer, deb/rpm have their own.
          add_platform linux-x86_64-appimage "Cuotai_${VERSION}_amd64.AppImage"
          add_platform linux-x86_64-deb "Cuotai_${VERSION}_amd64.deb"
          add_platform linux-x86_64-rpm "Cuotai_${VERSION}_amd64.rpm"
          add_platform linux-aarch64-appimage "Cuotai_${VERSION}_aarch64.AppImage"
          add_platform linux-aarch64-deb "Cuotai_${VERSION}_aarch64.deb"
          add_platform linux-aarch64-rpm "Cuotai_${VERSION}_aarch64.rpm"

          # A dispatch run has no updater key, so no build produces a `.sig`
          # and every platform above stays uncollected: the honest state is
          # "updater unavailable", not a fail-closed manifest read. Only a run
          # that signed at least one platform reaches `updater-manifest`, which
          # still fails a partially signed required set (`--require`).
          if [ "$DRY_RUN" = "true" ] && [ "$updater_count" -eq 0 ]; then
            printf '{"artifacts": []}\n' > fragments/assemble.json
            echo "dry-run: no updater key, so no updater artifact was signed; latest.json not generated (stated in signing-state.json)"
          elif [ "$updater_count" -gt 0 ]; then
            epoch="$(git show -s --format=%ct HEAD)"
            pub_date="$(date -u -d "@$epoch" +%Y-%m-%dT%H:%M:%SZ)"
            # `--require` names the platforms a complete release must serve, so
            # a run that signed only some of them fails instead of stranding
            # the rest.
            ./target/debug/xtask updater-manifest \
              --version "$VERSION" --repo "$REPO" --tag "$TAG" \
              --notes-file notes.txt \
              --pub-date "$pub_date" \
              "${platforms[@]}" \
              --require darwin-aarch64-app \
              --require darwin-x86_64-app \
              --require windows-x86_64-nsis \
              --require linux-x86_64-appimage \
              --out dist/latest.json
            jq -n '{artifacts: [{name: "latest.json", signed: false,
              method: "checksum-signature", status: "unsigned",
              note: "unsigned payload; integrity is authenticated through SHA256SUMS when its signature is available"}]}' \
              > fragments/assemble.json
            echo "updater manifest written for $updater_count platform entries"
          else
            echo "no updater artifact was signed in this release run" >&2
            exit 1
          fi
      - name: Manifest and SHA256SUMS
        run: ./target/debug/xtask release-manifest --artifacts-dir dist --version "$VERSION" --channel "$CHANNEL" --out-dir dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.check.outputs.dry_run != 'true'
      - name: Sign SHA256SUMS (Sigstore keyless)
        if: needs.check.outputs.dry_run != 'true'
        run: cosign sign-blob --yes --output-signature dist/SHA256SUMS.sig --output-certificate dist/SHA256SUMS.pem dist/SHA256SUMS
      - name: Signing state
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            checksums=unavailable
            status="dry-run: checksum signature not produced (dispatch runs never publish)"
          else
            checksums=signed
            status="signed by the GitHub Actions OIDC identity (Sigstore keyless)"
          fi
          ./target/debug/xtask signing-state \
            --version "$VERSION" --channel "$CHANNEL" \
            --manifest dist/manifest.json --fragments-dir fragments \
            --checksums "$checksums" --checksums-status "$status" \
            --out dist/signing-state.json
      - name: Release notes
        run: ./target/debug/xtask release-notes --changelog CHANGELOG.md --version "$VERSION" --manifest dist/manifest.json --signing-state dist/signing-state.json --repo "$REPO" --out dist/release-body.md
      - name: Dry-run attestation note
        if: needs.check.outputs.dry_run == 'true'
        run: |
          echo "dry-run: attestable artifacts produced; provenance attestations are not published on dispatch runs" >> "$GITHUB_STEP_SUMMARY"
      - name: Build provenance attestation
        if: needs.check.outputs.dry_run != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload release assembly
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assembly
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # RF4.1/RF4.3: tag runs only, behind the owner-configured `release` environment.
  # A failed or interrupted run leaves at most a draft.
  publish:
    name: draft, verify and publish the GitHub Release
    needs: [check, assemble]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      attestations: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download release assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembly
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Create or update the draft and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: dist
          BODY_FILE: dist/release-body.md
        run: scripts/release/publish-release.sh draft
      - name: Verify the complete draft assembly (RF4.4, pre-publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_DIR: dist
          BODY_FILE: dist/release-body.md
          XTASK: ./target/debug/xtask
        run: scripts/release/verify-release.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: dist
          BODY_FILE: dist/release-body.md
        run: scripts/release/publish-release.sh publish

  # RF4.4: after publishing, download the public assets again and re-check.
  verify-public:
    name: verify published assets
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ needs.check.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download release assembly (for the manifest)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembly
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify the complete public assembly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOCAL_DIR: dist
          BODY_FILE: dist/release-body.md
          XTASK: ./target/debug/xtask
        run: scripts/release/verify-release.sh

  # RF5.6: one renderer turns the verified release into every channel's
  # manifests. It reads only `manifest.json`/`signing-state.json` from the
  # assembly — never a rebuilt file — and runs after the release has been
  # re-verified (or after the full dry-run assembly on a dispatch).
  package-manifests:
    name: render package-manager manifests
    needs: [check, assemble, publish, verify-public]
    if: >-
      ${{ always() && needs.check.result == 'success'
          && needs.check.outputs.prerelease != 'true'
          && needs.assemble.result == 'success'
          && (needs.check.outputs.dry_run == 'true' || needs.verify-public.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.check.outputs.tag }}
      REPO: ${{ github.repository }}
      DRY_RUN: ${{ needs.check.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Build xtask
        run: cargo build -p xtask --locked
      - name: Download release assembly (manifest + signing state)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assembly
          path: dist
      - name: Render and validate every channel
        run: >-
          ./target/debug/xtask package-manifests
          --release-manifest dist
          --repo "$REPO" --tag "$TAG"
          --templates-dir packaging --out rendered
      - name: Channel status
        env:
          ENABLE_HOMEBREW: ${{ vars.PUBLISH_HOMEBREW }}
          ENABLE_WINGET: ${{ vars.PUBLISH_WINGET }}
          ENABLE_SCOOP: ${{ vars.PUBLISH_SCOOP }}
          ENABLE_CARGO: ${{ vars.PUBLISH_CARGO }}
          ENABLE_AUR: ${{ vars.PUBLISH_AUR }}
        run: |
          {
            echo "### Package-manager channels (RF5)"
            echo
            echo "| Channel | Repository variable | Enabled in this run |"
            echo "|---|---|---|"
            for channel in HOMEBREW WINGET SCOOP CARGO AUR; do
              eval "enabled=\${ENABLE_${channel}:-unset}"
              [ "$enabled" = "true" ] || enabled="disabled"
              echo "| $channel | PUBLISH_$channel | $enabled |"
            done
            echo
            echo "Rendered manifests are in the \`package-manifests\` artifact. This job only renders and validates; each channel job publishes on a tag run."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-manifests
          path: rendered/
          if-no-files-found: error
          retention-days: 7

  # RF5.1/RF5.7: independent, opt-in tag-only channel jobs. Each one
  # downloads the rendered manifests, never touches the release, and its
  # failure never fails the GitHub Release (nothing depends on it).
  channel-homebrew:
    name: "channel: Homebrew tap"
    needs: [check, package-manifests]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          && vars.PUBLISH_HOMEBREW == 'true'
          && needs.check.outputs.prerelease != 'true'
          && needs.package-manifests.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    environment: release
    continue-on-error: true
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'jmarcon/homebrew-cuotai' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: rendered
      - name: Homebrew style (own lint rules)
        run: brew style rendered/homebrew/Casks/cuotai.rb rendered/homebrew/Formula/cuotai.rb
      - name: Audit and install test against a temporary local tap (tag runs)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          tap_dir="$RUNNER_TEMP/tap"
          rm -rf "$tap_dir"
          mkdir -p "$tap_dir/Casks" "$tap_dir/Formula"
          cp rendered/homebrew/Casks/cuotai.rb "$tap_dir/Casks/"
          cp rendered/homebrew/Formula/cuotai.rb "$tap_dir/Formula/"
          cd "$tap_dir"
          git init -q .
          git config user.email "ci@${{ github.repository }}"
          git config user.name "cuotai release pipeline"
          git add -A
          git commit -qm "cuotai $VERSION"
          cd - >/dev/null
          brew untap jmarcon/cuotai >/dev/null 2>&1 || true
          brew tap jmarcon/cuotai "$tap_dir" --force
          # Download checks use the public release produced by this tag run.
          brew audit --strict --online --cask jmarcon/cuotai/cuotai
          brew audit --strict --online --formula jmarcon/cuotai/cuotai
          brew install --cask jmarcon/cuotai/cuotai
          brew install jmarcon/cuotai/cuotai
          "$(brew --prefix)/bin/cuotai" --version
          brew uninstall --cask jmarcon/cuotai/cuotai
          brew uninstall jmarcon/cuotai/cuotai
          brew untap jmarcon/cuotai
      - name: Push the rendered manifests to the tap (tag runs only)
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'jmarcon/homebrew-cuotai' }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo "::error::HOMEBREW_TAP_TOKEN is not set in the release environment; add a token scoped to $TAP_REPO (contents: write) or unset PUBLISH_HOMEBREW"
            exit 1
          }
          tap_dir="$RUNNER_TEMP/tap-push"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" "$tap_dir"
          mkdir -p "$tap_dir/Casks" "$tap_dir/Formula"
          cp rendered/homebrew/Casks/cuotai.rb "$tap_dir/Casks/"
          cp rendered/homebrew/Formula/cuotai.rb "$tap_dir/Formula/"
          git -C "$tap_dir" -c user.email "ci@github.com" -c user.name "cuotai release pipeline" \
            commit -qam "cuotai $VERSION" || echo "tap already up to date"
          git -C "$tap_dir" push origin HEAD
      - name: Channel status
        run: |
          echo "**Homebrew tap ($TAP_REPO)**: rendered cask and formula validated and pushed from this tag run." >> "$GITHUB_STEP_SUMMARY"

  channel-winget:
    name: "channel: winget"
    needs: [check, package-manifests]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          && vars.PUBLISH_WINGET == 'true'
          && needs.check.outputs.prerelease != 'true'
          && needs.package-manifests.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: rendered
      - name: winget validate (own schema checker)
        run: winget validate --manifest rendered/winget
      - name: Install and uninstall silently (tag runs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installerUrl = (Get-ChildItem Env:INSTALLER_URL).Value
          if (-not $installerUrl) { throw "INSTALLER_URL is not set" }
          $installer = Join-Path $env:RUNNER_TEMP 'Cuotai-setup.exe'
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/S' -Wait
          $installDir = "$env:LOCALAPPDATA\Cuotai"
          if (-not (Test-Path "$installDir\Cuotai.exe")) {
            throw "the silent install did not produce Cuotai.exe"
          }
          # RF8.2: uninstall keeps the user data.
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\cuotai" | Out-Null
          Set-Content -Path "$env:APPDATA\cuotai\config.toml" -Value "# uninstall sentinel"
          $uninstaller = Get-ChildItem $installDir -Filter 'uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "the silent install did not produce an uninstaller" }
          Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait
          if (Test-Path "$installDir\Cuotai.exe") {
            throw "the silent uninstall left Cuotai.exe installed"
          }
          if (-not (Test-Path "$env:APPDATA\cuotai\config.toml")) {
            throw "the uninstaller removed user data; RF8.2 requires it to be preserved"
          }
          Remove-Item -Recurse -Force "$env:APPDATA\cuotai"
        env:
          INSTALLER_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.check.outputs.tag }}/Cuotai_${{ needs.check.outputs.version }}_x64-setup.exe
      - name: Open a winget-pkgs pull request (tag runs, opt-in)
        if: vars.WINGET_SUBMIT == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_SUBMIT_TOKEN }}
          TAG: ${{ needs.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITHUB_TOKEN) {
            Write-Error "WINGET_SUBMIT_TOKEN is not set in the release environment; the first submission stays manual and unattended submissions stay off"
            exit 1
          }
          $exe = "wingetcreate.exe"
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe" -OutFile $exe
          $expected = "24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA"
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash
          if ($actual -ne $expected) { throw "wingetcreate.exe checksum mismatch: $actual" }
          ./wingetcreate.exe update Cuotai.Cuotai `
            --version $env:VERSION `
            --urls "https://github.com/$($env:REPO)/releases/download/$($env:TAG)/Cuotai_$($env:VERSION)_x64-setup.exe" `
            --token $env:GITHUB_TOKEN `
            --submit `
            --architecture x64
      - name: Channel status
        shell: bash
        run: |
          echo "**winget**: validated the rendered manifests; no submission unless WINGET_SUBMIT=true on a tag run." >> "$GITHUB_STEP_SUMMARY"

  channel-scoop:
    name: "channel: Scoop bucket"
    needs: [check, package-manifests]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          && vars.PUBLISH_SCOOP == 'true'
          && needs.check.outputs.prerelease != 'true'
          && needs.package-manifests.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    continue-on-error: true
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'jmarcon/scoop-cuotai' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: rendered
      - name: scoop install/uninstall from a local bucket (tag runs)
        run: |
          set -euo pipefail
          if ! type scoop >/dev/null 2>&1; then
            echo "::warning::Scoop is not installed on this runner; skipping the install test (the bucket manifest is still validated)"
            exit 0
          fi
          scoop bucket add cuotai ./rendered/scoop || true
          scoop install cuotai/cuotai
          cuotai --version
          # RF8.2: uninstall removes only the binary; a configuration the
          # user already had must survive it.
          mkdir -p "$APPDATA/cuotai"
          printf '# uninstall sentinel\n' > "$APPDATA/cuotai/config.toml"
          scoop uninstall cuotai/cuotai
          if [ ! -f "$APPDATA/cuotai/config.toml" ]; then
            echo "::error::the uninstall removed user data; RF8.2 requires it to be preserved"
            exit 1
          fi
          rm -rf "$APPDATA/cuotai"
      - name: Push the manifest to the bucket (tag runs only)
        env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO || 'jmarcon/scoop-cuotai' }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || {
            echo "::error::SCOOP_BUCKET_TOKEN is not set in the release environment; add a token scoped to $BUCKET_REPO (contents: write) or unset PUBLISH_SCOOP"
            exit 1
          }
          bucket_dir="$RUNNER_TEMP/bucket"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${BUCKET_REPO}.git" "$bucket_dir"
          mkdir -p "$bucket_dir/bucket"
          cp rendered/scoop/bucket/cuotai.json "$bucket_dir/bucket/"
          git -C "$bucket_dir" -c user.email "ci@github.com" -c user.name "cuotai release pipeline" \
            commit -qam "cuotai $VERSION" || echo "bucket already up to date"
          git -C "$bucket_dir" push origin HEAD
      - name: Channel status
        run: |
          echo "**Scoop bucket ($BUCKET_REPO)**: rendered bucket/cuotai.json validated; pushed only on a tag run." >> "$GITHUB_STEP_SUMMARY"

  channel-cargo:
    name: "channel: crates.io"
    needs: [check, package-manifests]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          && vars.PUBLISH_CARGO == 'true'
          && needs.check.outputs.prerelease != 'true'
          && needs.package-manifests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    continue-on-error: true
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # 1.99.1
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: . -> target
      - name: Packaging check for cuotai-core
        run: cargo publish --dry-run --locked -p cuotai-core
      - name: Packaging check for cuotai-tui
        # A published crate cannot depend on a path-only crate, so this only
        # succeeds once cuotai-core is on crates.io; until then it is the
        # documented state, not a pipeline failure.
        continue-on-error: true
        run: cargo publish --dry-run --locked -p cuotai-tui
      - name: Publish cuotai-core, then cuotai-tui (tag runs only)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$CARGO_REGISTRY_TOKEN" ] || {
            echo "::error::CARGO_REGISTRY_TOKEN is not set in the release environment; publish by hand or unset PUBLISH_CARGO"
            exit 1
          }
          # A published crate cannot depend on a path-only crate, so the
          # library goes first (RF5.4).
          cargo publish --locked -p cuotai-core
          # crates.io needs a moment before the index serves the new crate.
          for _ in $(seq 1 12); do
            if cargo publish --dry-run --locked -p cuotai-tui; then break; fi
            sleep 15
          done
          cargo publish --locked -p cuotai-tui
      - name: Channel status
        run: |
          echo "**crates.io**: packaging checked; published only on a tag run with CARGO_REGISTRY_TOKEN." >> "$GITHUB_STEP_SUMMARY"

  channel-aur:
    name: "channel: AUR (cuotai-bin)"
    needs: [check, package-manifests]
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
          && vars.PUBLISH_AUR == 'true'
          && needs.check.outputs.prerelease != 'true'
          && needs.package-manifests.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    continue-on-error: true
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download rendered manifests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-manifests
          path: rendered
      - name: PKGBUILD syntax (own shell parser)
        run: bash -n rendered/aur/PKGBUILD
      - name: Push PKGBUILD and .SRCINFO over SSH (tag runs only)
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [ -n "$AUR_SSH_PRIVATE_KEY" ] || {
            echo "::error::AUR_SSH_PRIVATE_KEY is not set in the release environment; add the AUR account's SSH key or unset PUBLISH_AUR"
            exit 1
          }
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Host keys are pinned against the fingerprints aur.archlinux.org
          # publishes; a mismatch aborts the push.
          ssh-keyscan -t ed25519,ecdsa,rsa aur.archlinux.org > "$HOME/.ssh/keyscan.tmp" 2>/dev/null
          ssh-keygen -lf "$HOME/.ssh/keyscan.tmp" -E sha256 | tee "$HOME/.ssh/fingerprints.txt"
          for fingerprint in \
            "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" \
            "SHA256:uTa/0PndEgPZTf76e1DFqXKJEXKsn7m9ivhLQtzGOCI" \
            "SHA256:5s5cIyReIfNNVGRFdDbe3hdYiI5OelHGpw2rOUud3Q8"; do
            grep -qF "$fingerprint" "$HOME/.ssh/fingerprints.txt" || {
              echo "::error::the AUR host key fingerprint $fingerprint was not seen; refusing to push"
              exit 1
            }
          done
          mv "$HOME/.ssh/keyscan.tmp" "$HOME/.ssh/known_hosts"
          rm -f ~/.ssh/id_ed25519
          work="$RUNNER_TEMP/aur"
          git clone "ssh://aur@aur.archlinux.org/cuotai-bin.git" "$work"
          cp rendered/aur/PKGBUILD rendered/aur/.SRCINFO "$work/"
          git -C "$work" -c user.email "aur@aur.archlinux.org" -c user.name "cuotai release pipeline" \
            commit -qam "cuotai $VERSION" || echo "AUR package already up to date"
          git -C "$work" push origin HEAD
      - name: Channel status
        run: |
          echo "**AUR cuotai-bin**: rendered PKGBUILD and .SRCINFO validated; pushed over SSH only on a tag run." >> "$GITHUB_STEP_SUMMARY"
