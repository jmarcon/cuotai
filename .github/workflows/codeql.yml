# GitHub code scanning (CodeQL "advanced setup"). It replaces the repository's
# "default setup" so that documentation-only changes do not start a scan: the
# default setup cannot be filtered by path, a workflow can.
#
# Same languages and query suite as the default setup had: actions,
# javascript-typescript, python, rust and swift, each with the `default`
# suite (what `scripts/codeql-local.sh` runs locally). Actions are pinned by
# commit hash (tag in the comment). No secrets are used, and pull requests run
# with `pull_request`, never `pull_request_target`.
#
# Documentation-only skip: a push or pull request whose changed files ALL
# match an excluded path starts no run (GitHub evaluates `paths` against the
# whole change). The excluded list mirrors the documentation allow-list of the
# `changes` job in ci.yml, so CI and CodeQL agree on what counts as docs:
#   - README.md, CONTRIBUTING.md, SECURITY.md, SUPPORT.md, AGENTS.md, apps/desktop/README.md
#   - docs/**/*.md and docs/assets/** (screenshots)
#   - .github/ISSUE_TEMPLATE/** and .github/*.md
#   - site/** (the project site; pages.yml builds and validates it)
# Deliberately scanned (code, see ci.yml): CHANGELOG.md, docs/providers.md,
# docs/*.json, licenses, THIRD_PARTY_NOTICES, apps/desktop/ui/**,
# scripts/site-build.sh and the workflows. `paths-ignore` cannot re-include docs/providers.md after the
# docs/**/*.md exclusion, so the list uses `paths` with `!` patterns, where a
# later pattern wins. The two lists below are identical; keep them (and the
# ci.yml allow-list) in sync when one changes.
#
# Swift is the one language with a traced build, and it runs on macOS (the
# scarcest runner: 14 minutes per analysis, measured on run 40205035023,
# queued 24 minutes behind the CI test and ui-checks jobs of parallel pull
# requests). Its only sources are the WidgetKit extension in
# apps/desktop/widgets/macos, so the `changes` job below runs it only when
# that folder or this workflow changed; the weekly schedule and a dispatch
# always run it, and so does a diff that cannot be computed. The alerts of
# the other four languages are unaffected: they analyze on every run.
#
# The weekly schedule keeps alerts fresh when no code is pushed (new queries
# and CodeQL releases can raise alerts on unchanged code). A skip marker in a
# commit message also skips this workflow (AGENTS.md).
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
      - "!CONTRIBUTING.md"
      - "!SECURITY.md"
      - "!SUPPORT.md"
      - "!AGENTS.md"
      - "!apps/desktop/README.md"
      - "!docs/**/*.md"
      - "!docs/assets/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/*.md"
      - "!site/**"
      - "docs/providers.md"
  pull_request:
    branches: [main]
    paths:
      - "**"
      - "!README.md"
      - "!CONTRIBUTING.md"
      - "!SECURITY.md"
      - "!SUPPORT.md"
      - "!AGENTS.md"
      - "!apps/desktop/README.md"
      - "!docs/**/*.md"
      - "!docs/assets/**"
      - "!.github/ISSUE_TEMPLATE/**"
      - "!.github/*.md"
      - "!site/**"
      - "docs/providers.md"
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request supersedes an older one.
# Runs on main are never cancelled, so every pushed commit keeps its analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which optional analyses this change needs. Swift is the only one so far.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.classify.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          range=""
          case "$EVENT" in
            pull_request) range="$BASE_SHA...$HEAD_SHA" ;;
            push)
              if [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="$BEFORE..$AFTER"
              fi
              ;;
          esac
          # Undecidable (schedule, dispatch, force push, new branch): analyze.
          swift=true
          why="event $EVENT, no diff to classify"
          if [ -n "$range" ]; then
            if list="$(git diff --name-only --no-renames "$range")"; then
              if [ -n "$list" ]; then
                swift=false
                why="no Swift source or workflow change in $range"
                while IFS= read -r file; do
                  case "$file" in
                    apps/desktop/widgets/macos/* | .github/workflows/codeql.yml)
                      swift=true
                      why="$file changed"
                      break
                      ;;
                  esac
                done <<< "$list"
              else
                why="empty diff for $range"
              fi
            else
              why="cannot diff $range"
            fi
          fi
          echo "swift=$swift" >> "$GITHUB_OUTPUT"
          echo "swift=$swift ($why)"

  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The only job that needs more than the read-only workflow token: the
    # SARIF upload writes code-scanning results.
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # No `queries` input: the action then runs each language's default
          # code-scanning suite (the same as the default setup). `queries:
          # default` is not a valid value; it is read as a query pack name.
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Swift needs a traced build on macOS: the WidgetKit sources of
  # apps/desktop/widgets/macos compile through their SwiftPM manifest. Same
  # category as before, so the alerts continue the existing series.
  analyze-swift:
    name: analyze (swift)
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
      # SwiftPM's manifest sandbox cannot spawn the manifest binary under the
      # CodeQL tracer, hence --disable-sandbox.
      - name: Build the Swift widget sources
        working-directory: apps/desktop/widgets/macos
        run: swift build --disable-sandbox
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
