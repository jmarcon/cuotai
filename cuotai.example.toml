# 9router: the quotas of the connections you already added in your own
# instance (an aggregator: each connection shows as a sub-account). Leave
# credential_env out when the instance's dashboard login is off.
[[accounts]]
name = "9router"
provider = "nine_router"
# credential_env = "NINEROUTER_PASSWORD"   # name of the variable holding the dashboard password
params = { base_url = "http://127.0.0.1:20128" }
# Optional keys of params: include = "claude,codex,github" (only these 9router
# providers), exclude = "glm" (hide these) and hidden = "<id>,<id>" (hide single
# connections; the id is in the connection details). A connection with the same
# provider and e-mail as a direct account is shown once, as the direct account
# (dedup = "auto", the default; "off" shows both, or show_both = "<id>" for one
# connection). group = "<slug>" ranks the connections in that group for "best
# account now"; without it each one ranks with its provider. Outside this machine use
# https://; plain http on a private network also needs allow_private_http = "true".
# A self-signed HTTPS instance: tls_ca_file = "/path/to/ca.pem" (the CA that
# signed it) or tls_pin_sha256 = "AB:CD:…" (its certificate's SHA-256, offered
# by Test connection for you to confirm); never both.

# OpenRouter, default view: limit, spend and free-model requests of an
# inference key (this key's numbers, not the account balance).
[[accounts]]
name = "OpenRouter key"
provider = "open_router"
credential_env = "OPENROUTER_API_KEY"

