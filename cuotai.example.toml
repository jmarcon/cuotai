# Copy to cuotai.toml. Repeat providers for multiple accounts.
# `name` is optional: without it the account shows its provider's name. Two accounts of the same
# provider both need a name, and names are unique (case-insensitive) across the file.
# Cuotai adds an `id = "acc_…"` line as the first key of each account on its next save: it keeps the
# account's bell, mutes, alerts and history across renames. When you copy an [[accounts]] block,
# delete its `id` line (a repeated id is rejected). Cuotai 0.80.0 is the oldest version that reads
# a file with ids or unnamed accounts; to go further back, delete the `id` lines and name every account.
# Credentials live in the environment or in the OAuth vault, never in this file. Remove accounts you do not use.
# For a login: wizard, Credential step, Tab → Sign in. It generates [accounts.oauth].
# 9router's native logins do not need your own client_id; Cloud Monitoring/Azure do.
# oauth and credential_env are mutually exclusive. Safe metadata comes from the login.
# For AWS Bedrock SSO through the CLI: preconfigured profile, F2. Kiro has its own native login.
refresh_seconds = 300 # global default for accounts without their own interval
concurrency = 4
timeout_seconds = 30

# Optional: accounts that can replace one another share a `group` (a slug of up to 32 lowercase letters,
# digits, - or _). Cuotai then marks the best account now of each group, as advice only. Without a group, only
# accounts of the same provider are compared. [[groups]] just gives a group a display name and a position;
# membership stays on the account.
# [[groups]]
# id = "coding"
# label = "Coding assistants"
# order = 1

# Opt in to the terminal update notice (off by default; CUOTAI_UPDATE_CHECK=1 does the same).
# [updates]
# check = true

[[accounts]]
name = "OpenAI API"
provider = "open_ai_api"
credential_env = "OPENAI_ADMIN_KEY"
# refresh_seconds = 60 # optional, for this account only (minimum 30 s)
# group = "coding" # optional, see the note above the first account
# params = { project_ids = "proj_1,proj_2", models = "gpt-4.1" }

