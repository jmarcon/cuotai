[[accounts]]
name = "Alibaba Token Plan (Qwen Cloud)"
provider = "alibaba_token_plan"
credential_env = "QWEN_API_KEY"
params = { cli_profile = "cuotai-qwen" }
# Wizard: F2 starts bl's international login on that profile; the CLI keeps the session.
# Alternative without the CLI: paste the home.qwencloud.com session in the
# wizard or the desktop dialog (system vault), or set
# params = { session_env = "QWEN_CLOUD_COOKIE" } and export the console Cookie
# in that variable, never in the TOML. A session takes precedence over the CLI.
# QWEN_API_KEY authenticates inference only; it is not sent to the quota query.

[[accounts]]
name = "Alibaba Cloud — billing"
provider = "alibaba_cloud"
