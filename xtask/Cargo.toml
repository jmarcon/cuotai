[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Repository automation tasks (release checks, manifest, signing state, release notes)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Package-manager manifests: winget ships YAML, Scoop JSON, Homebrew Ruby and
# AUR PKGBUILD. Parsing/validating them in Rust keeps the pipeline free of
# extra runtimes (PRD 0021 RF5.6).
serde_yaml = "0.9"
toml = "0.8"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
# The Tauri updater signature is a minisign signature: `tauri-cli` writes the
# same `.sig` files with this exact crate, so the pipeline tests can produce a
# real ephemeral-key signature and verify the manifest against it (PRD 0018 RF1).
minisign = "0.9"
base64 = "0.22"
