[workspace]
members = ["crates/cuotai-core", "crates/cuotai-tui"]
resolver = "2"

[workspace.package]
version = "0.39.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "sync", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
hmac = "0.12"
sha1 = "0.10"
