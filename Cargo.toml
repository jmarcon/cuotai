[workspace]
members = ["crates/cuotai-core", "crates/cuotai-tui", "xtask"]
resolver = "2"

[workspace.package]
version = "0.84.8"
edition = "2021"
license = "MIT OR Apache-2.0"
# PRD 0021 RF5.4: shared crates.io metadata. `rust-version` is the floor the
# pinned 1.99.1 toolchain satisfies and the highest `rust-version` any
# dependency in Cargo.lock requires.
rust-version = "1.89"
repository = "https://github.com/jmarcon/cuotai"
homepage = "https://github.com/jmarcon/cuotai"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "sync", "io-util", "net"] }
# PRD 0052 RF6.1: no built-in roots at all. `cuotai_core::network` loads the
# OS trust store once (rustls-native-certs) and gives it to every client, so
# nothing falls back to bundled webpki roots.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
thiserror = "2"
hmac = "0.12"
sha1 = "0.10"

# Lean development builds (owner request of 2026-11-05: every worktree builds
# its own target directory). Our crates keep file and line in panics and
# backtraces; dependencies carry no debug info. Release builds are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
