[package]
name = "cuotai-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
# PRD 0021 RF5.4: crates.io metadata. `cuotai-tui` is published only after
# `cuotai-core`, so the path dependency carries the published version too.
description = "Terminal dashboard and JSON CLI for AI-provider usage, quotas and costs (Cuotai)."
readme = "../../README.md"
keywords = ["ai", "llm", "quota", "usage", "monitoring"]
categories = ["command-line-utilities"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

# `cargo binstall cuotai-tui` downloads the release tarballs built by the
# release pipeline instead of compiling (PRD 0021 RF5.4).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cuotai-{ version }-{ target }.tar.gz"

[[bin]]
name = "cuotai"
path = "src/main.rs"

[dependencies]
# PRD 0012 RF4: `--serve` runs the core's local server.
cuotai-core = { path = "../cuotai-core", version = "0.81", features = ["serve"] }
chrono.workspace = true
serde_json.workspace = true
# `signal`: `--serve` and `--watch` shut down on SIGINT/SIGTERM (and `--watch` on SIGHUP).
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4", features = ["derive"] }
# PRD 0031 RF3: `--completions` for bash, zsh, fish and PowerShell.
clap_complete = "4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# Display width of card text (CJK, emoji, accents) for wrapping and truncation.
unicode-width = "0.2"
# PRD 0035 RF6.2: Backspace removes a whole grapheme (a letter with its
# combining marks, a Hangul or Devanagari cluster); already in the tree via ratatui.
unicode-segmentation = "1.13"
sys-locale = "0.3"
