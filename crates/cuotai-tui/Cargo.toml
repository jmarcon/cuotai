[package]
name = "cuotai-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
# PRD 0021 RF5.4: crates.io metadata. `cuotai-tui` is published only after
# `cuotai-core`, so the path dependency carries the published version too.
description = "Terminal dashboard and JSON CLI for AI-provider usage, quotas and costs (Cuotai)."
readme = "../../README.md"
keywords = ["ai", "llm", "quota", "usage", "monitoring"]
categories = ["command-line-utilities"]
repository.workspace = true
homepage.workspace = true

# Ready for the crates.io channel (PRD 0021 RF5.4): once the crate is
# published, cargo-binstall downloads the release archives built by the
# release pipeline instead of compiling. Windows archives are zips.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cuotai-{ version }-{ target }.tar.gz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cuotai-{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/cuotai-{ version }-{ target }.zip"
pkg-fmt = "zip"

[[bin]]
name = "cuotai"
path = "src/main.rs"

[dependencies]
# PRD 0012 RF4: `--serve` runs the core's local server.
cuotai-core = { path = "../cuotai-core", version = "0.87", features = ["serve"] }
chrono.workspace = true
serde_json.workspace = true
# `signal`: `--serve` and `--watch` shut down on SIGINT/SIGTERM (and `--watch` on SIGHUP).
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4", features = ["derive"] }
# PRD 0031 RF3: `--completions` for bash, zsh, fish and PowerShell.
clap_complete = "4"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# Display width of card text (CJK, emoji, accents) for wrapping and truncation.
unicode-width = "0.2"
# PRD 0035 RF6.2: Backspace removes a whole grapheme (a letter with its
# combining marks, a Hangul or Devanagari cluster); already in the tree via ratatui.
unicode-segmentation = "1.13"
sys-locale = "0.3"

[dev-dependencies]
# PRD 0052 RF5: temporary artifact trees in the erase tests (already in the
# tree through the core).
tempfile = "3"
