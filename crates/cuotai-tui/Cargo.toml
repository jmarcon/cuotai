[package]
name = "cuotai-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cuotai"
path = "src/main.rs"

[dependencies]
# PRD 0012 RF4: `--serve` runs the core's local server.
cuotai-core = { path = "../cuotai-core", features = ["serve"] }
chrono.workspace = true
serde_json.workspace = true
# `signal`: `--serve` and `--watch` shut down on SIGINT/SIGTERM (and `--watch` on SIGHUP).
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
