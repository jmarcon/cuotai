[package]
name = "cuotai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
# PRD 0021 RF5.4: crates.io metadata. `cuotai-core` is published before
# `cuotai-tui`, because a published crate cannot depend on a path-only crate.
description = "Read-only monitor core for AI-provider usage, quotas and costs (Cuotai backend library)."
readme = "../../README.md"
keywords = ["ai", "llm", "quota", "usage", "monitoring"]
categories = ["api-bindings", "asynchronous"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest.workspace = true
thiserror.workspace = true
futures-util = "0.3"
toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "v5"] }
keyring = { version = "4.2", features = ["v1"] }
sha2 = "0.10"
# PRD 0028 RF1: the JSON path of the field a decode failed on.
serde_path_to_error = "0.1"
base64 = "0.22"
hmac.workspace = true
sha1.workspace = true
rand = "0.8"
url = "2"
rsa = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
rusqlite = { version = "0.39", features = ["bundled"] }
dirs = "6"
# PRD 0012 RF2: HTTP/1.x request parsing for the optional local server.
httparse = { version = "=1.10.1", optional = true }

# PRD 0017 RF3.3: the extension's process tree killed on timeout (a
# process group on Unix, a kill-on-close Job Object on Windows) and the
# low-priority child.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
default = []
# PRD 0012 RF2/RF3: `serve::LocalServer`, the read-only loopback HTTP server.
serve = ["dep:httparse"]

[dev-dependencies]
# Builds the crate's own tests with `serve`, so `cargo test --workspace`
# covers the server without turning the feature on for the binaries.
cuotai-core = { path = ".", features = ["serve"] }
wiremock = "0.6"
parking_lot = "0.12"
